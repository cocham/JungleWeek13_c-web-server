name: Feature / Learning Task
description: C Web Server 구현과 Top-down 학습을 함께 기록합니다.
title: "[Area] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 구현 목표
      description: 외부에서 관찰 가능한 동작과 구현 범위를 적습니다.
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: 요청 처리 흐름
      description: 영향을 받는 모듈이나 함수 흐름을 적습니다. 협업 이슈라면 작업 순서나 선행 이슈를 적습니다.
  - type: textarea
    id: questions
    attributes:
      label: 학습 질문
      description: 사용한 POSIX API, FD 수명주기, 메모리 소유권과 블로킹 동작을 설명합니다.
  - type: textarea
    id: tests
    attributes:
      label: 테스트 / 완료 조건
      description: 어떤 방법으로 확인하고 어떤 결과가 나오면 완료인지 적습니다.
      placeholder: |
        - [ ] GET /index.html 요청에 200과 HTML 본문이 돌아온다.
        - [ ] 팀원 3명이 같은 커밋에서 같은 명령으로 서버를 실행한다.
    validations:
      required: true
